getDailySales=SELECT SUM(total_price) AS daily_total_revenue FROM orders WHERE DATE(order_time) = CURDATE() AND status = 'COMPLETED'

getOrderList=SELECT o.order_id, o.order_time, GROUP_CONCAT(CONCAT(m.name, ' ', oi.quantity) SEPARATOR ', ') AS order_details, o.total_price, o.status FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN menus m ON oi.menu_id = m.menu_id GROUP BY o.order_id ORDER BY o.order_id DESC